version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: la_victoria_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: la_victoria_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: la_victoria_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lavictoria.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8080:80'
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
