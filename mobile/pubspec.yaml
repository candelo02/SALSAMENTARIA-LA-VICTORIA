name: la_victoria_mobile
description: "Aplicación móvil empresarial para gestión comercial, pedidos, inventario y rutas con sincronización offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
